<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · IconicStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --charcoal: #16161c;
            --charcoal-deep: #0e0e12;
            --panel: #ffffff;
            --gold: #c9a227;
            --gold-bright: #e3c15a;
            --ink: #1c1c22;
            --ink-soft: #6b6b76;
            --line: #e7e5e0;
            --error: #b3452c;
        }
        *{ box-sizing:border-box; margin:0; padding:0; }
        body{
            font-family:'Inter', sans-serif;
            min-height:100vh;
            display:flex;
            background:var(--panel);
        }
        .brand-panel{
            flex:1 1 44%;
            background:
                    radial-gradient(circle at 20% 20%, rgba(201,162,39,0.14), transparent 45%),
                    linear-gradient(160deg, var(--charcoal) 0%, var(--charcoal-deep) 100%);
            color:#f3f1ea;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            padding:56px 48px;
            position:relative;
            overflow:hidden;
        }
        .brand-panel::after{
            content:"";
            position:absolute;
            left:48px; right:48px; bottom:180px;
            height:1px;
            background:linear-gradient(90deg, var(--gold) 0%, transparent 70%);
            opacity:0.5;
        }
        .wordmark{
            font-family:'Playfair Display', serif;
            font-size:28px;
            font-weight:600;
            letter-spacing:0.5px;
        }
        .wordmark span{ color:var(--gold-bright); }
        .brand-copy{ max-width:360px; }
        .brand-eyebrow{
            text-transform:uppercase;
            letter-spacing:2.5px;
            font-size:11px;
            color:var(--gold-bright);
            margin-bottom:18px;
            font-weight:600;
        }
        .brand-copy h1{
            font-family:'Playfair Display', serif;
            font-weight:500;
            font-size:34px;
            line-height:1.28;
            color:#f7f5ee;
        }
        .brand-foot{
            font-size:13px;
            color:#9c9a92;
        }
        .form-panel{
            flex:1 1 56%;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px;
        }
        .form-wrap{
            width:100%;
            max-width:380px;
        }
        .form-wrap h2{
            font-family:'Playfair Display', serif;
            font-size:26px;
            font-weight:600;
            color:var(--ink);
            margin-bottom:6px;
        }
        .form-sub{
            color:var(--ink-soft);
            font-size:14px;
            margin-bottom:36px;
        }
        .field{
            margin-bottom:20px;
        }
        .field label{
            display:block;
            font-size:12px;
            font-weight:600;
            letter-spacing:0.4px;
            text-transform:uppercase;
            color:var(--ink-soft);
            margin-bottom:8px;
        }
        .field input{
            width:100%;
            padding:13px 14px;
            border:1px solid var(--line);
            border-radius:2px;
            font-size:15px;
            font-family:'Inter', sans-serif;
            color:var(--ink);
            background:#fcfcfb;
            transition:border-color .18s ease, box-shadow .18s ease;
        }
        .field input:focus{
            outline:none;
            border-color:var(--gold);
            box-shadow:0 0 0 3px rgba(201,162,39,0.15);
            background:#fff;
        }
        .row-between{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:26px;
        }
        .remember{
            display:flex;
            align-items:center;
            gap:8px;
            font-size:13px;
            color:var(--ink-soft);
        }
        .forgot{
            font-size:13px;
            color:var(--ink);
            text-decoration:none;
            border-bottom:1px solid var(--gold);
            padding-bottom:1px;
        }
        button.submit{
            width:100%;
            padding:14px;
            background:var(--charcoal);
            color:#f3f1ea;
            border:none;
            border-radius:2px;
            font-size:14px;
            font-weight:600;
            letter-spacing:0.6px;
            text-transform:uppercase;
            cursor:pointer;
            transition:background .18s ease, transform .12s ease;
        }
        button.submit:hover{ background:#232329; }
        button.submit:active{ transform:translateY(1px); }
        button.submit:disabled{ opacity:0.6; cursor:not-allowed; }
        .status{
            margin-top:16px;
            font-size:13px;
            padding:10px 12px;
            border-radius:2px;
            display:none;
        }
        .status.error{
            display:block;
            background:#fbeeea;
            color:var(--error);
            border:1px solid #f0d3c8;
        }
        .status.success{
            display:block;
            background:#eef4ec;
            color:#3d6b3f;
            border:1px solid #d3e4d0;
        }
        .signup-hint{
            margin-top:28px;
            font-size:13px;
            color:var(--ink-soft);
            text-align:center;
        }
        .signup-hint a{
            color:var(--ink);
            font-weight:600;
            text-decoration:none;
            border-bottom:1px solid var(--gold);
        }
        @media (max-width: 860px){
            body{ flex-direction:column; }
            .brand-panel{ padding:36px 28px; min-height:220px; }
            .brand-panel::after{ display:none; }
            .brand-copy h1{ font-size:24px; }
            .form-panel{ padding:32px 24px; }
        }
    </style>
</head>
<body>

<div class="brand-panel">
    <div class="wordmark">ICONIC<span>STORE</span></div>
    <div class="brand-copy">
        <div class="brand-eyebrow">Member Access</div>
        <h1>Curated pieces.<br>One account away.</h1>
    </div>
    <div class="brand-foot">&copy; 2026 IconicStore. All rights reserved.</div>
</div>

<div class="form-panel">
    <div class="form-wrap">
        <h2>Sign in</h2>
        <p class="form-sub">Enter your details to access your account.</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <div class="row-between">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Keep me signed in
                </label>
                <a class="forgot" href="#">Forgot password?</a>
            </div>

            <button type="submit" class="submit" id="submitBtn">Sign In</button>

            <div id="statusBox" class="status"></div>
        </form>

        <p class="signup-hint">New to IconicStore? <a href="/register.html">Create an account</a></p>
    </div>
</div>

const API_BASE_URL = "";
<script>
    // Point this at wherever your Spring Boot backend is running.
    const API_BASE_URL = "http://localhost:8080";

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("statusBox");

    function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = "status " + type;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById('errorMsg');

        if (!username || !password) {
            showStatus("Please enter both username and password.", "error");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Signing In...";
        statusBox.className = "status";

        try {
            const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.message || "Invalid username or password.");
            }

            const data = await response.json();
            // Expected response shape: { token: "...", username: "...", role: "..." }

            // Store the JWT. localStorage is convenient but is readable by any JS
            // on the page (XSS risk) — for a production app prefer an httpOnly
            // cookie set by the server instead. Fine for a learning/demo project.
            localStorage.setItem("iconicstore_token", data.token);
            localStorage.setItem("iconicstore_user", data.username);

            showStatus("Signed in successfully. Redirecting...", "success");
            setTimeout(() => {
                window.location.href = "/dashboard.html";
            }, 700);

        } catch (err) {
            showStatus(err.message || "Something went wrong. Please try again.", "error");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In";
        }
    });
</script>

</body>
</html>
