<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop · IconicStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --charcoal: #16161c;
            --charcoal-deep: #0e0e12;
            --card: #ffffff;
            --gold: #c9a227;
            --gold-bright: #e3c15a;
            --ink: #1c1c22;
            --ink-soft: #6b6b76;
            --line: #e7e5e0;
            --bg: #faf9f6;
        }
        *{ box-sizing:border-box; margin:0; padding:0; }
        body{
            font-family:'Inter', sans-serif;
            background:var(--bg);
            color:var(--ink);
            min-height:100vh;
        }

        /* ---- Header ---- */
        header{
            background:linear-gradient(160deg, var(--charcoal) 0%, var(--charcoal-deep) 100%);
            color:#f3f1ea;
            padding:20px 40px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            position:sticky;
            top:0;
            z-index:10;
            box-shadow:0 2px 14px rgba(0,0,0,0.15);
        }
        .wordmark{
            font-family:'Playfair Display', serif;
            font-size:22px;
            font-weight:600;
            letter-spacing:0.5px;
        }
        .wordmark span{ color:var(--gold-bright); }
        .header-right{
            display:flex;
            align-items:center;
            gap:20px;
        }
        #userLabel{
            font-size:13px;
            color:#c8c6bd;
        }
        .cart-btn{
            position:relative;
            background:none;
            border:1px solid rgba(255,255,255,0.25);
            color:#f3f1ea;
            padding:8px 16px;
            border-radius:2px;
            font-size:13px;
            font-weight:500;
            cursor:pointer;
            transition:border-color .15s ease;
        }
        .cart-btn:hover{ border-color:var(--gold-bright); }
        .cart-count{
            display:inline-block;
            background:var(--gold);
            color:#1c1c22;
            font-size:11px;
            font-weight:700;
            padding:1px 6px;
            border-radius:10px;
            margin-left:6px;
        }
        .logout-btn{
            background:none;
            border:none;
            color:#c8c6bd;
            font-size:13px;
            cursor:pointer;
            text-decoration:underline;
            text-underline-offset:3px;
        }
        .logout-btn:hover{ color:var(--gold-bright); }

        /* ---- Hero strip ---- */
        .hero{
            padding:40px 40px 24px;
            max-width:1200px;
            margin:0 auto;
        }
        .hero-eyebrow{
            text-transform:uppercase;
            letter-spacing:2.5px;
            font-size:11px;
            color:var(--gold);
            font-weight:600;
            margin-bottom:10px;
        }
        .hero h1{
            font-family:'Playfair Display', serif;
            font-size:32px;
            font-weight:600;
        }
        .hero p{
            color:var(--ink-soft);
            font-size:14px;
            margin-top:8px;
        }

        /* ---- Filter bar ---- */
        .filter-bar{
            max-width:1200px;
            margin:0 auto;
            padding:0 40px 20px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .filter-chip{
            padding:8px 18px;
            border:1px solid var(--line);
            border-radius:20px;
            background:var(--card);
            font-size:13px;
            font-weight:500;
            color:var(--ink-soft);
            cursor:pointer;
            transition:all .15s ease;
        }
        .filter-chip:hover{ border-color:var(--gold); color:var(--ink); }
        .filter-chip.active{
            background:var(--charcoal);
            color:#f3f1ea;
            border-color:var(--charcoal);
        }

        /* ---- Product grid ---- */
        .grid{
            max-width:1200px;
            margin:0 auto;
            padding:10px 40px 60px;
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
            gap:24px;
        }
        .card{
            background:var(--card);
            border:1px solid var(--line);
            border-radius:4px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            transition:box-shadow .2s ease, transform .2s ease;
        }
        .card:hover{
            box-shadow:0 10px 28px rgba(0,0,0,0.08);
            transform:translateY(-3px);
        }
        .card-media{
            height:160px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:56px;
            background:
                    radial-gradient(circle at 30% 20%, rgba(201,162,39,0.10), transparent 55%),
                    #f1efe9;
            position:relative;
        }
        .badge{
            position:absolute;
            top:10px;
            left:10px;
            background:var(--charcoal);
            color:var(--gold-bright);
            font-size:10px;
            font-weight:700;
            letter-spacing:0.5px;
            text-transform:uppercase;
            padding:4px 9px;
            border-radius:2px;
        }
        .card-body{
            padding:16px 18px 18px;
            display:flex;
            flex-direction:column;
            flex:1;
        }
        .card-category{
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:1px;
            color:var(--gold);
            font-weight:600;
            margin-bottom:6px;
        }
        .card-name{
            font-family:'Playfair Display', serif;
            font-size:17px;
            font-weight:600;
            color:var(--ink);
            margin-bottom:4px;
        }
        .card-desc{
            font-size:12.5px;
            color:var(--ink-soft);
            margin-bottom:14px;
            line-height:1.4;
        }
        .card-footer{
            margin-top:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .price{
            font-size:16px;
            font-weight:700;
            color:var(--ink);
        }
        .price .paise{
            font-size:12px;
            font-weight:500;
            color:var(--ink-soft);
        }
        .add-btn{
            background:var(--charcoal);
            color:#f3f1ea;
            border:none;
            padding:9px 16px;
            border-radius:2px;
            font-size:12px;
            font-weight:600;
            letter-spacing:0.4px;
            text-transform:uppercase;
            cursor:pointer;
            transition:background .15s ease;
        }
        .add-btn:hover{ background:#232329; }
        .add-btn.added{ background:#3d6b3f; }

        @media (max-width: 640px){
            header{ padding:16px 20px; }
            .hero, .filter-bar, .grid{ padding-left:20px; padding-right:20px; }
            #userLabel{ display:none; }
        }
    </style>
</head>
<body>

<header>
    <div class="wordmark">ICONIC<span>STORE</span></div>
    <div class="header-right">
        <span id="userLabel"></span>
        <button class="cart-btn" id="cartBtn">Cart<span class="cart-count" id="cartCount">0</span></button>
        <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
</header>

<div class="hero">
    <div class="hero-eyebrow">Sports Collection</div>
    <h1>Gear up for the game</h1>
    <p>Handpicked football and turf essentials — from match balls to boots.</p>
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="grid" id="productGrid"></div>

<script>
    // ---- Guard: redirect to login if not authenticated ----
    const token = localStorage.getItem("iconicstore_token");
    const username = localStorage.getItem("iconicstore_user");
    if (!token) {
        window.location.href = "/login.html";
    }
    document.getElementById("userLabel").textContent = username ? `Hi, ${username}` : "";

    // ---- Product data ----
    // In the real app, replace this with a fetch() call to your
    // GET /api/products endpoint (with the Authorization: Bearer token header).
    const products = [
        { id: 1, name: "Match Football",      category: "Football",  icon: "⚽", price: 1499, desc: "FIFA-quality size 5 ball, all-weather turf grip." },
        { id: 2, name: "Home Jersey",         category: "Jersey",    icon: "👕", price: 2299, desc: "Breathable dri-fit fabric, embroidered crest." },
        { id: 3, name: "Away Jersey",         category: "Jersey",    icon: "👕", price: 2299, desc: "Lightweight polyester blend, sweat-wicking." },
        { id: 4, name: "Goalkeeper Gloves",   category: "Gloves",    icon: "🧤", price: 1899, desc: "Latex palm grip with wrist strap support." },
        { id: 5, name: "Firm Ground Boots",   category: "Boots",     icon: "👟", price: 4999, desc: "Molded studs for natural grass pitches." },
        { id: 6, name: "Turf Boots",          category: "Boots",     icon: "👟", price: 3799, desc: "Rubber sole designed for artificial turf." },
        { id: 7, name: "Shin Guards",         category: "Protection",icon: "🛡️", price: 799,  desc: "Lightweight EVA foam with ankle sleeve." },
        { id: 8, name: "Training Cones (Set)",category: "Training",  icon: "🔶", price: 599,  desc: "Set of 20, foldable, carry bag included." },
        { id: 9, name: "Captain's Armband",   category: "Accessories",icon:"🎗️", price: 349,  desc: "Elastic fit, embroidered gold star." },
        { id: 10, name: "Sports Duffel Bag",  category: "Accessories",icon:"🎒", price: 2199, desc: "Water-resistant, separate boot compartment." },
        { id: 11, name: "Ankle Support Socks",category: "Accessories",icon:"🧦", price: 449,  desc: "Compression fit, cushioned heel and toe." },
        { id: 12, name: "Referee Whistle",    category: "Accessories",icon:"📯", price: 249,  desc: "Pealess design, weatherproof body." }
    ];

    const categories = ["All", ...new Set(products.map(p => p.category))];
    let activeCategory = "All";
    let cartCount = 0;

    function formatINR(amount) {
        return "₹" + amount.toLocaleString("en-IN");
    }

    function renderFilters() {
        const bar = document.getElementById("filterBar");
        bar.innerHTML = "";
        categories.forEach(cat => {
            const chip = document.createElement("button");
            chip.className = "filter-chip" + (cat === activeCategory ? " active" : "");
            chip.textContent = cat;
            chip.addEventListener("click", () => {
                activeCategory = cat;
                renderFilters();
                renderProducts();
            });
            bar.appendChild(chip);
        });
    }

    function renderProducts() {
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        const filtered = activeCategory === "All"
            ? products
            : products.filter(p => p.category === activeCategory);

        filtered.forEach(p => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
        <div class="card-media">
          <span class="badge">${p.category}</span>
          <span>${p.icon}</span>
        </div>
        <div class="card-body">
          <div class="card-category">${p.category}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-footer">
            <div class="price">${formatINR(p.price)}</div>
            <button class="add-btn" data-id="${p.id}">Add to Cart</button>
          </div>
        </div>
      `;
            grid.appendChild(card);
        });

        // Wire up "Add to Cart" buttons
        grid.querySelectorAll(".add-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                cartCount++;
                document.getElementById("cartCount").textContent = cartCount;
                btn.textContent = "Added ✓";
                btn.classList.add("added");
                setTimeout(() => {
                    btn.textContent = "Add to Cart";
                    btn.classList.remove("added");
                }, 1200);
            });
        });
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("iconicstore_token");
        localStorage.removeItem("iconicstore_user");
        window.location.href = "/login.html";
    });

    renderFilters();
    renderProducts();
</script>

</body>
</html>
